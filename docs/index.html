</style>
</head>

    out.append(el('p', 'note', `${L.length} card${L.length === 1 ? '' : 's'} match "${S.q}" (searching every card the finder tracks: A$60 and up). Tap ☆ to add one to your wish list.`)); const g = el('div', 'grid'); for (const c of L.slice(0, 60)) g.append(cardEl(c)); out.append(g); if (L.length > 60) out.append(el('p', 'note', `${L.length - 60} more: add a word to narrow it.`)); return; }
  if (S.tab === 'wish') { const ids = Object.keys(S.wish); out.append(el('p', 'note', 'Your wish list: the cards you want and the price you would pay. Each one starts at a suggested price (10% under today, or its 2-week low if that is lower): change it any time. When a card reaches your price it moves to the top. Kept on this phone only: use Copy list to keep a backup or move it to another device.'));
    const bar = el('div', 'chips'), cp = el('button', 'chip', 'Copy list'), ps = el('button', 'chip', 'Paste list'); cp.onclick = async () => { const t = JSON.stringify(S.wish); try { await navigator.clipboard.writeText(t); cp.textContent = 'Copied'; } catch { window.prompt('Copy this:', t); } };
    ps.onclick = () => { const t = window.prompt('Paste a copied wish list:'); if (!t) return; try { const j = JSON.parse(t); Object.assign(S.wish, j); saveWish(); draw(); } catch { alert('That is not a copied wish list.'); } }; bar.append(cp, ps); out.append(bar);
    if (!ids.length) { out.append(el('p', 'empty', 'Nothing on it yet. Search for a card above, or tap ☆ on any card in the other tabs.')); return; }
    const I = S.idx; if (!I) { out.append(el('p', 'empty', 'Loading today\'s prices…')); loadIndex().then(draw); return; }
    const L = ids.map((id) => I.get(id) || { id, ...S.wish[id], aud: S.wish[id].aud0, st: 'Not priced today (under A$60 or no recent sales)', stKey: 'holding', sp: [] }).filter(byGame).sort((a, b) => a.aud / S.wish[a.id].target - b.aud / S.wish[b.id].target);
    const g = el('div', 'grid'); for (const c of L) g.append(cardEl(c)); out.append(g); return; }
  if (S.tab === 'deals') { const L = D.deals.filter(byGame).filter((c) => S.hz === 'all' || c.hz === S.hz).filter(inBand).sort((a, b) => (a.check ? 1 : 0) - (b.check ? 1 : 0)); /* cards to double-check go below the clean ones */
    out.append(el('p', 'note', `Cards worth A$${D.band[0]}–${D.band[1]} that are 25%+ under their 6-month high and have stopped falling (steady or turning up over the last 2 weeks). Hold length goes by the set's age: short under 9 months (still settling after launch), medium 9–30 months, long older (out of print). Biggest drops first; cards whose drop needs checking against sold prices come after them.`));
    if (!L.length) { out.append(el('p', 'empty', 'Nothing matches these filters today.')); return; } const g = el('div', 'grid'); for (const c of L.slice(0, 80)) g.append(cardEl(c)); out.append(g); if (L.length > 80) out.append(el('p', 'note', `${L.length - 80} more not shown: narrow the filters.`)); return; }
  if (S.tab === 'ebay') { const X = S.ebay; out.append(el('p', 'note', 'Live Buy It Now listings on eBay Australia, checked every morning, priced (with postage) at least 20% under the card\'s market price. Exact matches (right number, version and language, single raw card) come first; after them, listings with the right card number that differ somehow, each labelled (slab, lot or pick-a-card, maybe another version, Japanese copy, very cheap) for you to judge. Good ones sell fast and some are played cards or fakes: check the photos, the condition and the seller\'s feedback before buying. eBay Money Back Guarantee covers you if it is not as described.'));
    if (!X || !X.items) { out.append(el('p', 'empty', 'Not switched on yet: it needs the free eBay developer key in GitHub Secrets (EBAY_CLIENT_ID and EBAY_CLIENT_SECRET).')); return; } out.append(el('p', 'meta', `${X.checked} cards checked ${ago(X.at)}`));
    const L = X.items.filter((x) => byGame(x.card)).filter((x) => S.ex !== 'exact' || x.exact !== false); if (!L.length) { out.append(el('p', 'empty', 'Nothing listed 20%+ under market for this game today.')); return; } const g = el('div', 'grid');
    for (const x of L.slice(0, 80)) { const d = cardEl(x.card), bx = el('div', 'st ' + (x.exact === false ? 'easing' : 'settled'), `${x.exact === false ? 'Check: ' + x.flags.join(' · ') + ' · ' : ''}On eBay AU now: ${aud(x.aud)}${x.post ? ' incl. ' + aud(x.post) + ' post' : x.post === 0 ? ' free post' : ''}, ${Math.round(x.under * 100)}% under market${x.cond ? ' · ' + x.cond : ''}${x.seller ? ` · seller ${x.seller.fb}% (${x.seller.n})` : ''}${x.loc ? ' · ' + x.loc : ''}`), a = el('a', null, 'Open this listing'); a.href = x.url; a.target = '_blank'; a.rel = 'noopener'; const t = el('div', 'meta', x.title);
      const body = d.children[1]; body.insertBefore(t, body.children[3]); body.insertBefore(bx, body.children[4]); const lk = el('div', 'links buy'); lk.append(a); body.insertBefore(lk, body.children[5]); g.append(d); } out.append(g); return; }
  if (S.tab === 'new') { const L = D.newSets.filter(byGame); out.append(el('p', 'note', 'Sets released in the last ~10 weeks and their dearest cards. Chase cards usually peak at launch and slide for a few weeks as more packs are opened: wait while they are still falling; look when they have settled.'));
    if (!L.length) { out.append(el('p', 'empty', 'No new sets in the last 10 weeks for this game.')); return; }
    for (const s of L) { const box = el('div', 'set'); box.append(el('h2', null, `${s.set}${s.abbr ? ' (' + s.abbr + ')' : ''}`), el('div', 'meta', `${GN[s.g]} · released ${s.rel || '?'} (${s.age} days ago) · chase cards ${pc(s.avgOff)} from their highs on average`));
      const v = el('div', 'verdict', s.verdict); v.style.color = s.ready ? 'var(--ok)' : s.falling ? 'var(--bad)' : 'var(--warn)'; box.append(v); const g = el('div', 'grid'); for (const c of s.chase) g.append(cardEl(c)); box.append(g); out.append(box); } return; }
  if (S.tab === 'slabs') { const X = S.slabs, typ = (X && X.typical) || 0.87;
    if (!X || !X.items) { out.append(el('p', 'empty', 'The slab list fills in after the next daily run.')); return; } if (!S.idx) { out.append(el('p', 'empty', 'Loading price history…')); loadIndex().then(() => { if (S.tab === 'slabs') draw(); }); return; }
    const pass = (c) => byGame(c) && (S.hz === 'all' || c.hz === S.hz) && inBand(c);
    /* 22 Nov: like Dropped deals. First the good buys: cards that have dropped 25%+ off their high and stopped falling, with a slab for sale on Collector Crypt at a fair price */
    const buys = (X.buys || []).filter(pass).sort((a, b) => (a.raw.off || 0) - (b.raw.off || 0));
    out.append(el('h3', 'sec', `Good buys on Collector Crypt (${buys.length})`));
    out.append(el('p', 'note', `Cards that have dropped 25%+ under their 6-month high and stopped falling (the same cards as Dropped deals), with a graded slab of that exact card for sale on Collector Crypt at or under its valuation. Biggest drops first. Buy, hold for the time shown, and list it back on Collector Crypt when the price recovers. Paid in USDC from your Solana wallet.`));
    if (buys.length) { const g = el('div', 'grid'); for (const c of buys.slice(0, 60)) g.append(slabEl(c, typ)); out.append(g); } else out.append(el('p', 'empty', X.buys ? 'None for these filters today.' : 'Fills in after the next daily run.'));
    /* 22 Nov (Ryan: "even a cheap buy under $100 for a 5 year or more hold, taken out of the vault, and higher end cards too"): long-term
       keepers: grade 9-10 slabs of fan-favourite characters, at or under the usual price, not still falling, any price */
    const seenK = new Set(), keep = [...(X.buys || []), ...X.items.filter((c) => c.src !== 'Magic Eden').map((c) => { const raw = matchSlab(c, S.idx); return { ...c, raw, hz: slabHold(c, raw) }; })]
      .filter((c) => { if (seenK.has(c.mint)) return false; seenK.add(c.mint); return true; }).filter((c) => byGame(c) && inBand(c) && keeper(c));
    keep.sort((a, b) => gradeNum(b.grade) - gradeNum(a.grade) || (b.vsTyp || 0) - (a.vsTyp || 0));
    out.append(el('h3', 'sec', `Long-term keepers: 5+ year holds (${keep.length})`));
    out.append(el('p', 'note', 'Grade 9 and 10 slabs of the characters that have held their value for decades (Charizard, Pikachu, the Eeveelutions, Mewtwo, Rayquaza, Luffy, Zoro, Shanks, Goku and the like), at or under the usual Collector Crypt price and not still falling. Buy, then take it out of the vault (redeem) and keep it. Redeeming costs 2% of the valuation plus insured post to Australia, shown on each card; on a cheap slab the post can be a big part of the cost, so it suits buying a few and redeeming them together if Collector Crypt allows. Highest grade first.'));
    if (keep.length) { const g = el('div', 'grid'); for (const c of keep.slice(0, 60)) { const d = slabEl({ ...c, hz: 'keeper' }, typ); const st = d.querySelector('.hz'); if (st) st.textContent = '5+ year hold'; const r = el('div', 'meta', `To take it out of the vault: about ${aud(c.insAud * 0.02)} (2%) plus insured post to Australia`); d.children[1].insertBefore(r, d.querySelector('.links.buy')); g.append(d); } out.append(g); } else out.append(el('p', 'empty', 'None for these filters today.'));
    /* then: any slab listed under what Collector Crypt cards usually sell for */
    const have = new Set(buys.map((c) => c.mint)), all = X.items.filter((c) => c.src !== 'Magic Eden' && !have.has(c.mint)).map((c) => { const raw = matchSlab(c, S.idx); return { ...c, raw, hz: slabHold(c, raw) }; }).filter(pass);
    const rank = (c) => (c.underBb ? 1 : 0) + (c.vsTyp || 0) + (c.raw ? ({ settled: 0.08, turning: 0.06, holding: 0.03, easing: 0.01, falling: -0.08, dropping: -0.1 }[c.raw.stKey] || 0) : 0); all.sort((a, b) => rank(b) - rank(a));
    out.append(el('h3', 'sec', `Cheap slabs: under the usual price (${all.length})`));
    out.append(el('p', 'note', `Any slab listed under what Collector Crypt cards usually sell for (about ${Math.round(typ * 100)}% of their valuation), whether or not the card has dropped. Where the Card Finder tracks the card you get its price line and status; settled ones first.`));
    out.append(el('p', 'meta', `${X.ccSeen || X.seen} Collector Crypt listings read ${ago(X.at)}`));
    if (all.length) { const g = el('div', 'grid'); for (const c of all.slice(0, 60)) g.append(slabEl(c, typ)); out.append(g); } else out.append(el('p', 'empty', 'None for these filters today.'));
    return; }
  const L = D.upcoming.filter(byGame); out.append(el('p', 'note', 'Sets coming out soon. Prices before and just after release are usually the highest they will be: note the chase cards, then check the New releases tab 3–6 weeks after launch.'));
  if (!L.length) { out.append(el('p', 'empty', 'No upcoming sets listed for this game.')); return; }
  for (const s of L) { const box = el('div', 'set'); box.append(el('h2', null, `${s.set}${s.abbr ? ' (' + s.abbr + ')' : ''}`), el('div', 'meta', `${GN[s.g]} · out ${s.rel} (in ${s.days} days)`)); if (s.chase.length) { box.append(el('div', 'verdict', 'Pre-sale prices of its dearest cards:')); const g = el('div', 'grid'); for (const c of s.chase) g.append(cardEl(c)); box.append(g); } else box.append(el('p', 'note', 'No card prices listed yet.')); out.append(box); } }
let qt = null; $('q').oninput = () => { clearTimeout(qt); qt = setTimeout(() => { S.q = $('q').value.trim(); draw(); }, 250); };
function badge() { const b = null; if (!b) return; const n = S.idx ? Object.keys(S.wish).filter((id) => { const c = S.idx.get(id); return c && c.aud <= S.wish[id].target; }).length : 0; b.textContent = 'Wish list'; if (n) b.append(el('span', 'badge', String(n))); }
document.querySelectorAll('#games .chip').forEach((b) => { b.onclick = () => { S.game = b.dataset.g; store.set('game', S.game); draw(); }; });
(async () => { try { const r = await fetch('cards/data/cards.json?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) S.D = await r.json(); } catch {} try { const r = await fetch('cards/data/slabs.json?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) S.slabs = await r.json(); } catch {} try { const r = await fetch('cards/data/ebay.json?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) S.ebay = await r.json(); } catch {}
  $('upd').textContent = S.D ? `Updated ${ago(S.D.at)} · TCGplayer prices (raw, near mint) in AUD` : 'No data yet'; if (Object.keys(S.wish).length) loadIndex().then(() => draw()); draw(); })();
