function badge() { const b = null; if (!b) return; const n = S.idx ? Object.keys(S.wish).filter((id) => { const c = S.idx.get(id); return c && c.aud <= S.wish[id].target; }).length : 0; b.textContent = 'Wish list'; if (n) b.append(el('span', 'badge', String(n))); }
document.querySelectorAll('#games .chip').forEach((b) => { b.onclick = () => { S.game = b.dataset.g; store.set('game', S.game); draw(); }; });
(async () => { try { const r = await fetch('cards/data/cards.json?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) S.D = await r.json(); } catch {} try { const r = await fetch('cards/data/slabs.json?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) S.slabs = await r.json(); } catch {} try { const r = await fetch('cards/data/ebay.json?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) S.ebay = await r.json(); } catch {}
  $('upd').textContent = S.D ? `Updated ${ago(S.D.at)} · TCGplayer prices (raw, near mint) in AUD` : 'No data yet'; if (Object.keys(S.wish).length) loadIndex().then(() => draw()); draw(); })();
