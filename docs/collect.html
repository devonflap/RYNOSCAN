<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collector Checklist</title>
<!-- 23 Nov (Ryan: "show me a list with a picture of each Zoro card and Vegeta card above $50 worth adding to my collection, no matter the price,
     with pricing in Australian dollars and a link where to buy"). Every card the Card Finder tracks for the characters in ?c= (comma-separated),
     dearest first, from its daily TCGplayer prices (A$60 and up is what it keeps). Default: Zoro and Vegeta. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 23 Nov (Ryan: "give it a better vibe, more style"): a binder per character. Zoro's page is sword-green and brass, Vegeta's is Saiyan navy
   and armour gold; the character's name is the big, loud thing, everything under it stays quiet so the card pictures and prices do the work. */
:root { --bg:#0c1f17; --s1:#123026; --s2:#173b2f; --line:#22493b; --text:#eef4ec; --muted:#93b1a2; --hue:#45c486; --gold:#e3bb55; --ok:#5fd394; --warn:#f2bf4a; --bad:#ff6b6b; --link:#e3bb55; color-scheme:dark;
  --disp:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif; --body:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif; }
body[data-who="vegeta"] { --bg:#0b1433; --s1:#121f4a; --s2:#182858; --line:#26397a; --text:#f1f4fc; --muted:#a2afd8; --hue:#5b86ff; --gold:#f0c84e; --link:#f0c84e; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 var(--body); transition:background .35s; }
body::before { content:''; position:fixed; inset:0 0 auto; height:340px; background:radial-gradient(120% 100% at 85% -20%, color-mix(in srgb, var(--hue) 28%, transparent), transparent 70%); pointer-events:none; z-index:-1; }
a { color:var(--link); }
:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
header { padding:14px 16px 6px; max-width:900px; margin:0 auto; }
.top { display:flex; justify-content:space-between; align-items:center; font-size:.8rem; color:var(--muted); } .top a { text-decoration:none; font-weight:600; }
#who { display:flex; gap:14px; align-items:baseline; margin:6px 0 2px; overflow-x:auto; scrollbar-width:none; }
.tab { flex:none; background:none; border:0; padding:0; cursor:pointer; font:900 2.1rem/0.95 var(--disp); letter-spacing:.01em; color:transparent; -webkit-text-stroke:1.2px var(--muted); transition:color .2s; }
.tab.on { font-size:3.6rem; color:var(--text); -webkit-text-stroke:0; }
.prog { font-size:.86rem; color:var(--muted); margin:6px 0 6px; } .prog b { color:var(--text); font:800 1.25rem var(--disp); }
.bar { height:6px; border-radius:6px; background:var(--s1); overflow:hidden; } .bar i { display:block; height:100%; border-radius:6px; background:linear-gradient(90deg, var(--hue), var(--gold), #fff5cc, var(--gold)); background-size:200% 100%; animation:foil 4s linear infinite; }
@keyframes foil { to { background-position:-200% 0; } } @media (prefers-reduced-motion:reduce) { .bar i { animation:none; } body { transition:none; } }
.sub { color:var(--muted); font-size:.76rem; margin:8px 0 0; }
.chips { display:flex; gap:6px; margin-top:8px; overflow-x:auto; scrollbar-width:none; } .chips::-webkit-scrollbar, #who::-webkit-scrollbar { display:none; }
.tools { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; margin-top:6px; } .tools::-webkit-scrollbar { display:none; } .tools .chips { margin:0; flex:none; background:var(--s1); border-radius:999px; padding:3px; gap:2px; }
.chip { flex:none; border:0; background:none; color:var(--muted); border-radius:999px; padding:6px 11px; font:600 .8rem var(--body); cursor:pointer; } .chip.on { background:var(--s2); color:var(--text); box-shadow:inset 0 0 0 1px var(--line); }
#view .chip.on { background:var(--gold); color:#1d1500; box-shadow:none; }
main { padding:6px 16px 48px; max-width:900px; margin:0 auto; }
.empty { color:var(--muted); padding:20px 0; } .gd { color:var(--muted); font-size:.78rem; margin:0 0 8px; }
.game { font:800 1.05rem var(--disp); color:var(--hue); letter-spacing:.02em; margin:22px 0 4px; }
/* categories: binder dividers */
details.sec { margin:6px 0; background:var(--s1); border-radius:14px; border-left:4px solid var(--hue); overflow:hidden; }
details.sec > summary { list-style:none; cursor:pointer; padding:11px 14px 11px 12px; display:flex; justify-content:space-between; gap:10px; align-items:center; } details.sec > summary::-webkit-details-marker { display:none; }
details.sec > summary::after { content:''; width:8px; height:8px; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:rotate(-45deg); transition:transform .2s; flex:none; } details.sec[open] > summary::after { transform:rotate(45deg); }
.st2 { font:800 1.25rem/1.05 var(--disp); letter-spacing:.01em; flex:1; } .ss { color:var(--muted); font-size:.74rem; white-space:nowrap; text-align:right; }
details.sec.gold { border-left-color:var(--gold); } details.sec.gold .st2 { color:var(--gold); }
details.sec > .gd { padding:0 14px; } .rows { display:flex; flex-direction:column; }
/* card rows */
details.row { border-top:1px solid var(--line); } details.row > summary { list-style:none; cursor:pointer; display:grid; grid-template-columns:40px 1fr auto; gap:10px; align-items:center; padding:7px 12px 7px 10px; } details.row > summary::-webkit-details-marker { display:none; }
details.row[open] > summary { background:var(--s2); }
details.row img { width:40px; height:56px; object-fit:cover; border-radius:4px; background:var(--bg); box-shadow:0 0 0 1px var(--line); }
.rt { min-width:0; } .rn { font-size:.86rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .rm { font-size:.7rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
.lg { display:flex; gap:3px; margin-top:4px; flex-wrap:nowrap; overflow:hidden; } .lg span { font-size:.66rem; font-weight:600; color:var(--muted); background:var(--bg); border-radius:5px; padding:1px 5px; white-space:nowrap; } .lg span.on { color:var(--text); box-shadow:inset 0 0 0 1px var(--hue); } .lg span.cheap { color:var(--ok); }
.rside { display:flex; flex-direction:column; align-items:flex-end; gap:4px; } .rp { text-align:right; white-space:nowrap; } .rp b { font:800 1.15rem var(--disp); letter-spacing:.01em; } .rp small { color:var(--muted); font-size:.62rem; margin-right:3px; }
.dot { font-size:.62rem; margin-left:4px; } .dot.ok { color:var(--ok); } .dot.bad { color:var(--bad); }
.rb { display:flex; gap:3px; } .ib { width:27px; height:25px; border-radius:7px; border:0; background:var(--bg); color:var(--muted); font-size:.85rem; line-height:1; cursor:pointer; } .ib.on { color:#1d1500; background:var(--gold); } .ib.got { color:#05210f; background:var(--ok); }
details.row.isfirst > summary { background:linear-gradient(90deg, color-mix(in srgb, var(--gold) 14%, transparent), transparent 55%); } details.row.isfirst img { box-shadow:0 0 0 2px var(--gold); } details.row.have { opacity:.7; }
/* a card opened */
.c { background:var(--s2); border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:5px; min-width:0; position:relative; }
.c.detail { margin:0; border-radius:0; padding:4px 12px 14px 60px; } .c.detail > img, .c.detail > .first, .c.detail > .del, .c.detail > .got { display:none; }
.nm { font-weight:600; font-size:.86rem; line-height:1.25; } .c.detail > .nm { display:none; } .meta { color:var(--muted); font-size:.72rem; line-height:1.35; }
.pr { display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; } .pr b { font:800 1.2rem var(--disp); } .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
.st { font-size:.72rem; } .tag { display:inline-block; background:var(--ok); color:#05210f; border-radius:999px; padding:0 7px; font-size:.66rem; font-weight:700; }
.links { display:flex; flex-wrap:wrap; gap:5px; font-size:.74rem; padding-top:4px; } .links a { text-decoration:none; background:var(--bg); color:var(--text); border-radius:999px; padding:4px 10px; font-weight:600; } .links a:hover { color:var(--gold); }
.grail { align-self:flex-start; border:1px solid var(--gold); color:var(--gold); background:none; border-radius:999px; padding:2px 10px; font:600 .72rem var(--body); cursor:pointer; } .grail.on { background:var(--gold); color:#1d1500; }
.gl { font-size:.76rem; } .gl input { width:5.5em; background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:3px 5px; font:inherit; }
.slab { font-size:.74rem; color:var(--muted); } .slab a { text-decoration:none; font-weight:600; }
.langs { display:grid; gap:6px; margin-top:4px; } .lrow { display:grid; grid-template-columns:34px 1fr; gap:8px; align-items:start; background:var(--bg); border-radius:10px; padding:7px 8px; font-size:.74rem; }
.lrow img { width:34px; aspect-ratio:5/7; object-fit:cover; border-radius:3px; } .lrow .lt { font:800 .95rem var(--disp); color:var(--hue); } .lrow b { font:800 1.05rem var(--disp); margin-right:4px; } .lrow .links { padding-top:3px; } .lrow .links a { background:var(--s1); }
.c.have { opacity:.6; } .got { display:flex; align-items:center; gap:6px; font-size:.8rem; font-weight:600; cursor:pointer; } .got input { width:18px; height:18px; accent-color:var(--ok); }
.first { position:absolute; top:6px; right:6px; width:34px; height:34px; border-radius:999px; border:0; background:rgba(0,0,0,.5); color:#fff; font-size:1.2rem; cursor:pointer; } .first.on { color:var(--gold); }
.del { position:absolute; top:6px; left:6px; height:30px; padding:0 10px; border-radius:999px; border:0; background:rgba(0,0,0,.5); color:#fff; font:inherit; font-size:.75rem; cursor:pointer; }
.warn.small { font-size:.7rem; }
</style>

let GRADED = {}, EXCLU = {}, EXTRA = [], XP = {}; /* 23 Nov: Ryan's own additions (cards/extras.json) and their Card Rush prices */ const GRADE_ORDER = ['PSA 10', 'CGC 10', 'BGS 10', 'BGS 9.5', 'CGC 9.5', 'PSA 9', 'CGC 9'];

const ebayJp = (c) => ebayJapanese(c);
const draw = (cards) => { const out = document.getElementById('out'); out.textContent = ''; const who = CUR || want[0];
  const re = RX[who] || new RegExp('\\b' + who.replace(/[^a-z0-9 ]/g, '') + '\\b', 'i'), L = cards.filter((c) => re.test(c.name) && !(EXCL[who] && EXCL[who].test(c.name)) && c.aud >= 10 && inBand(c));
