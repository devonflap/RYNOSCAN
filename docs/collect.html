  const L = el('div', 'links'); for (const [t, u] of [['eBay AU', `https://www.ebay.com.au/sch/i.html?_nkw=${encodeURIComponent(x.ebay)}&_sop=15&LH_PrefLoc=1`], ['eBay sold', `https://www.ebay.com.au/sch/i.html?_nkw=${encodeURIComponent(x.ebay)}&LH_Sold=1&LH_Complete=1`], cr ? ['Card Rush (Japan)', cr.url] : null].filter(Boolean)) { const a = el('a', null, t); a.href = u; a.target = '_blank'; a.rel = 'noopener'; L.append(a); }

  if (cr) d.append(el('div', 'meta', `Card Rush: ${aud(cr.aud)} (¥${cr.yen.toLocaleString('en-AU')})${cr.stock ? '' : ' · sold out'}`)); d.append(L); starBtn(k, d); delBtn(k, d); return d; }
function jpBox(x) { const d = el('div', 'c' + (GOT['jp:' + x.url] ? ' have' : '')), im = el('img'); im.src = x.img || ''; im.alt = x.name; im.loading = 'lazy'; im.onerror = () => { im.style.visibility = 'hidden'; }; d.append(im);
  const lab = el('label', 'got'), cb = el('input'); cb.type = 'checkbox'; cb.checked = !!GOT['jp:' + x.url]; cb.onchange = () => { if (cb.checked) GOT['jp:' + x.url] = new Date().toISOString().slice(0, 10); else delete GOT['jp:' + x.url]; saveGot(); render(); }; lab.append(cb, document.createTextNode(cb.checked ? 'Got it' : 'Got it?'));
  const pr = el('div', 'pr'); pr.append(el('b', null, aud(x.aud)), el('span', 'meta', `¥${x.yen.toLocaleString('en-AU')}${x.stock ? '' : ' · sold out'}`)); const L = el('div', 'links');
  for (const [t, u] of [['Card Rush (Japan)', x.url], ['eBay AU', `https://www.ebay.com.au/sch/i.html?_nkw=${encodeURIComponent(`${x.num || ''} japanese ${x.g === 'OP' ? 'zoro' : 'vegeta'}`.trim())}&_sop=15&LH_PrefLoc=1`]]) { const a = el('a', null, t); a.href = u; a.target = '_blank'; a.rel = 'noopener'; L.append(a); }
  d.append(lab, el('div', 'nm', x.name), el('div', 'meta', `Japanese · #${x.num || '?'}`), pr, L); starBtn('jp:' + x.url, d); delBtn('jp:' + x.url, d); return d; }
/* My collection (owned) and Removed (deleted): every kind of card, per character */
function listOf(store, title, empty, note) { const out = document.getElementById('out'); out.textContent = ''; out.append(el('p', 'gd', note));
  for (const who of want) { const re = RX[who] || new RegExp('\\b' + who.replace(/[^a-z0-9 ]/g, '') + '\\b', 'i'), C = CARDS.filter((c) => store[c.id] && re.test(c.name)), Jx = (EXCLU[who] || []).filter((x) => store['jp:' + x.url]), Xx = EXTRA.filter((x) => x.who === who && store['x:' + x.id]), n = C.length + Jx.length + Xx.length;
    const h = el('h2', null, who.replace(/^./, (x) => x.toUpperCase())); h.append(el('small', null, n ? `${n} card${n > 1 ? 's' : ''} · worth about ${aud(C.reduce((t, c) => t + c.aud, 0) + Jx.reduce((t, x) => t + x.aud, 0) + Xx.reduce((t, x) => t + ((XP[x.id] && XP[x.id].aud) || x.seen.aud), 0))} today` : empty)); out.append(h);
    if (!n) continue; const g = el('div', 'grid'); for (const c of C.sort((a, b) => b.aud - a.aud)) g.append(cardBox(c)); for (const x of Jx) g.append(jpBox(x)); for (const x of Xx) g.append(extraBox(x)); out.append(g); } }
let CARDS = []; const render = () => (view === 'check' ? checklist(CARDS) : view === 'mine' ? listOf(GOT, 'My collection', 'None yet: tick Got it on the checklist', 'Cards you have ticked Got it, with what they are worth at today\'s prices. Untick one to put it back on the checklist.') : view === 'removed' ? listOf(DEL, 'Removed', 'Nothing removed', 'Cards you deleted from the checklist. Tap Restore to put one back.') : draw(CARDS));
(async () => { let I; const J = async (f) => (await fetch(`cards/data/${f}?t=${Date.now()}`, { cache: 'no-store' })).json();
  try { I = await J('chars.json'); } catch { try { I = await J('index.json'); } catch { document.getElementById('out').textContent = 'Could not load the card list. Try again shortly.'; return; } }
  try { const j = await J('japanese.json'); JP = j.byId || {}; EXCLU = j.exclusives || {}; } catch { /* not built yet */ }
  try { GRADED = (await J('graded.json')).byId || {}; } catch { /* not built yet */ }
  try { const X = await (await fetch('cards/extras.json?t=' + Date.now(), { cache: 'no-store' })).json(); EXTRA = X.cards || [];
    /* 23 Nov (Ryan: "use the star as the cards on the current buy list"): cards he asked for are starred once on this phone; un-starring sticks */
    let seeded = []; try { seeded = JSON.parse(localStorage.getItem('collect-seeded') || '[]'); } catch { seeded = []; } let ch = false;
    for (const k of X.buyList || []) if (!seeded.includes(k)) { if (!GOT[k]) FIRST[k] = new Date().toISOString().slice(0, 10); seeded.push(k); ch = true; }
    if (ch) { saveFirst(); try { localStorage.setItem('collect-seeded', JSON.stringify(seeded)); } catch { /* private mode */ } } } catch { /* none */ }
  try { XP = (await J('japanese.json')).extras || {}; } catch { /* none */ }
  document.getElementById('sub').textContent = `Every card for each character from A$10, dearest first: English prices are TCGplayer's market price (raw, near mint) in A$, updated ${new Date(I.at).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' })}. Under each One Piece and Fusion World card is its Japanese printing from Card Rush in Japan (they don't ship overseas: use a proxy like Buyee or ZenMarket) and on eBay AU. "Good time to buy" = off its high and stopped falling.`;
  const S = document.getElementById('sort'); for (const [k, t] of [['price', 'Dearest first'], ['drop', 'Biggest drop first']]) { const b = el('button', 'chip' + (sort === k ? ' on' : ''), t); b.onclick = () => { sort = k; [...S.children].forEach((x) => x.classList.toggle('on', x === b)); render(); }; S.append(b); }
  const B = document.getElementById('band'); for (const [k, t] of [['all', 'Any price'], ['lo', 'A$10–60'], ['hi', 'A$60+']]) { const b = el('button', 'chip' + (band === k ? ' on' : ''), t); b.onclick = () => { band = k; [...B.children].forEach((x) => x.classList.toggle('on', x === b)); render(); }; B.append(b); }
  CARDS = I.cards; const V = document.getElementById('view'); for (const [k, t] of [['check', 'Checklist'], ['mine', 'My collection'], ['removed', 'Removed'], ['all', 'Every card']]) { const b = el('button', 'chip' + (view === k ? ' on' : ''), t); b.onclick = () => { view = k; [...V.children].forEach((x) => x.classList.toggle('on', x === b)); render(); }; V.append(b); }
  render(); })();
