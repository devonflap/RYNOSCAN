name: RynoScan watchdog
# Safeguard 1: GitHub sometimes skips scheduled runs. This separate workflow, on its own schedule, checks the dashboard data
# and restarts the scan if the last one is more than 95 minutes old (6am-10pm Brisbane), then tells your phone.
on:
  schedule:
    - cron: '17,47 20-23,0-11 * * *'
  workflow_dispatch:
concurrency:
  group: rynoscan-watchdog
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Is a scan running?
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list --workflow scan.yml --limit 10 --json status --jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting")] | length' || echo 0)
          echo "RUNNING=${n:-0}" >> "$GITHUB_ENV"
      - name: Check freshness
        id: d
        run: node src/watchdog.mjs
      - name: Restart the scan and tell my phone
        if: steps.d.outputs.action == 'restart'
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WHY: ${{ steps.d.outputs.reason }}
        run: |
          if gh workflow run scan.yml; then msg="The scan was overdue ($WHY), so the watchdog restarted it. Fresh charts in about 5 minutes."; else msg="The scan is overdue ($WHY) and the watchdog could not restart it. Open the Actions tab and run RynoScan scan manually."; fi
          echo "$msg"
          [ -n "$NTFY_TOPIC" ] && curl -s -H "Title: RynoScan watchdog" -H "Priority: default" -H "Tags: rhinoceros,warning" -H "Click: https://github.com/${{ github.repository }}/actions" -d "$msg" "https://ntfy.sh/$NTFY_TOPIC" || true
