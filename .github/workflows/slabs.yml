# Collector Crypt lists, every hour (22 Nov, Ryan: "make it refresh more often"). Only src/slabs.mjs: Collector Crypt's marketplace (drops,
# quick flips, keepers, cheap slabs) against the cards' price history from the daily card run (TCGplayer prices only change once a day).
name: Collector Crypt hourly
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: card-finder
  cancel-in-progress: false
jobs:
  slabs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Collector Crypt marketplace
        run: node src/slabs.mjs
      - name: Save
        run: |
          git config user.name "rynoscan-bot"
          git config user.email "rynoscan-bot@users.noreply.github.com"
          git add docs/cards/data/slabs.json docs/cards/data/ccsales.json
          git diff --cached --quiet && echo "no changes" || (git commit -q -m "slabs $(date -u +%Y-%m-%dT%H:%MZ)" && (for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push -q && break; sleep $((i*5)); done))
