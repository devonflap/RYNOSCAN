name: RynoScan BTC and ETH range backtest
on:
  workflow_dispatch: {}   # by hand only: the BTC and ETH range bots were retired on 24 Oct (no edge in any of eight readings)
permissions:
  contents: write
concurrency:
  group: rynoscan-majors
  cancel-in-progress: false
jobs:
  majors:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Backtest the Monday range on BTC and ETH (a year of Coinbase candles)
        run: node src/majorsbt.mjs
      - name: Save results
        run: |
          git config user.name "rynoscan-bot"
          git config user.email "rynoscan-bot@users.noreply.github.com"
          git add docs/data/majors-bt.json
          git diff --cached --quiet && echo "no changes" || (git commit -m "majors backtest $(date -u +%Y-%m-%d)" && (for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep $((i*5)); done; git fetch -q && [ "$(git rev-parse HEAD)" = "$(git rev-parse @{u})" ]))
