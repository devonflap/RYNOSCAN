# One-off probe (21 Nov): can the gacha marketplaces' slab listings be read? Writes nothing.
name: Slab probe
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (compatible; RynoScan card finder)"
          echo "== ME listing token"
          curl -s -A "$UA" "https://api-mainnet.magiceden.dev/v2/collections/collector_crypt/listings?offset=0&limit=2&sort=listPrice&sort_direction=desc" | python3 -c "
          import json,sys; d=json.load(sys.stdin)
          for x in d[:2]:
            t=x.get('token',{}); print('price',x.get('price'),'| name',t.get('name')); print(' attrs',json.dumps(t.get('attributes'))[:900]); print(' keys',list(t.keys()))"
          echo "== ME token metadata"; M=$(curl -s -A "$UA" "https://api-mainnet.magiceden.dev/v2/collections/collector_crypt/listings?offset=0&limit=1" | python3 -c "import json,sys;print(json.load(sys.stdin)[0]['tokenMint'])"); curl -s -A "$UA" "https://api-mainnet.magiceden.dev/v2/tokens/$M" | head -c 1500; echo
          echo "== Courtyard js"
          curl -s -A "$UA" -o cy.html https://courtyard.io/marketplace
          grep -oE 'src="[^"]+\.js[^"]*"' cy.html | head -40 | sed 's/src="//;s/"$//' > js.txt; wc -l js.txt
          for js in $(cat js.txt); do case $js in http*) u=$js;; *) u="https://courtyard.io$js";; esac; curl -s -A "$UA" "$u"; done > all.js; wc -c all.js
          grep -oE '"/(v[0-9]/)?[a-z-]+/[a-zA-Z0-9/_${}.-]*"' all.js | sort | uniq -c | sort -rn | grep -iE "market|listing|asset|search|card|collect|token|price" | head -40
          grep -oE 'api\.courtyard\.io[a-zA-Z0-9/_${}.?=&-]*' all.js | sort -u | head -20
          grep -oE '.{60}api\.courtyard\.io.{80}' all.js | head -5
