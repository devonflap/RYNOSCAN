# One-off probe (21 Nov): can the gacha marketplaces' slab listings be read? Writes nothing.
name: Slab probe
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (compatible; RynoScan card finder)"
          echo "== Courtyard js"
          curl -s -A "$UA" -o cy.html https://courtyard.io/marketplace
          grep -oE 'src="[^"]+\.js[^"]*"' cy.html | head -40 | sed 's/src="//;s/"$//' > js.txt; wc -l js.txt
          for js in $(cat js.txt); do case $js in http*) u=$js;; *) u="https://courtyard.io$js";; esac; curl -s -A "$UA" "$u"; done > all.js; wc -c all.js
          grep -oE '"/index/[a-zA-Z0-9/_${}.-]*"' all.js | sort -u | head -30
          grep -oE '.{100}"/index/search[^"]*".{200}' all.js | head -3
          grep -oE '.{80}"/prices/search".{200}' all.js | head -2
          for u in "https://api.courtyard.io/index/search?limit=2" "https://api.courtyard.io/index/assets?limit=2" "https://api.courtyard.io/marketplace/activity?limit=2"; do echo "-- $u"; curl -s -A "$UA" -w " [%{http_code}]" "$u" | head -c 700; echo; done
          curl -s -A "$UA" -X POST -H "content-type: application/json" -d '{"limit":2,"query":"","sort":"price_asc"}' -w " [%{http_code}]" https://api.courtyard.io/index/search | head -c 900; echo
