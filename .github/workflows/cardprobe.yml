# One-off probe (21 Nov): what tcgcsv holds for Pokémon and One Piece. Writes nothing.
name: Card probe
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="RynoScan card finder (github.com/devonflap/RYNOSCAN)"
          curl -s -A "$UA" https://tcgcsv.com/last-updated.txt; echo
          curl -s -A "$UA" https://tcgcsv.com/tcgplayer/categories | python3 -c "
          import json,sys; d=json.load(sys.stdin); r=d.get('results',d)
          print('keys',list(d.keys()) if isinstance(d,dict) else 'list')
          for c in r:
            n=(c.get('name','')+' '+c.get('displayName','')).lower()
            if 'pok' in n or 'one piece' in n: print(c.get('categoryId'),c.get('name'),'|',c.get('displayName'))"
          for C in 3 68; do echo "== groups $C"; curl -s -A "$UA" https://tcgcsv.com/tcgplayer/$C/groups | python3 -c "
          import json,sys; d=json.load(sys.stdin); r=d['results']; print(len(r),'groups'); r.sort(key=lambda g:g.get('publishedOn',''),reverse=True)
          for g in r[:8]: print(g['groupId'],g['name'],g.get('abbreviation'),g.get('publishedOn'),g.get('isSupplemental'))"; done
          G=$(curl -s -A "$UA" https://tcgcsv.com/tcgplayer/68/groups | python3 -c "import json,sys; r=json.load(sys.stdin)['results']; r.sort(key=lambda g:g.get('publishedOn',''),reverse=True); print([g['groupId'] for g in r if not g.get('isSupplemental')][2])")
          echo "== sample OP group $G"; curl -s -A "$UA" https://tcgcsv.com/tcgplayer/68/$G/products > p.json; curl -s -A "$UA" https://tcgcsv.com/tcgplayer/68/$G/prices > q.json
          python3 -c "
          import json; p=json.load(open('p.json'))['results']; q=json.load(open('q.json'))['results']
          print(len(p),'products',len(q),'price rows'); print(json.dumps(p[0])[:900])
          pr={}
          for x in q: pr.setdefault(x['productId'],[]).append(x)
          from collections import Counter
          print('rarities',Counter([next((e['value'] for e in x.get('extendedData',[]) if e['name']=='Rarity'),None) for x in p]).most_common(20))
          print('subtypes',Counter(x['subTypeName'] for x in q))
          top=sorted(q,key=lambda x:-(x.get('marketPrice') or 0))[:12]
          nm={x['productId']:x['name'] for x in p}
          for x in top: print(x['marketPrice'],x['lowPrice'],x['subTypeName'],nm.get(x['productId']))"
          which 7z 7za || true
          D=$(date -u -d '3 days ago' +%Y-%m-%d); curl -s -A "$UA" -o a.7z https://tcgcsv.com/archive/tcgplayer/prices-$D.ppmd.7z -w "archive %{http_code} %{size_download}\n"; 7z l a.7z | head -12; 7z l a.7z | grep -c "/68/"; 7z x -y -oa a.7z "$D/68/*" -r >/dev/null; find a -type f | head -3; f=$(find a -type f | head -1); head -c 300 "$f"; echo
