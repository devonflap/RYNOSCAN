# The Alts desk (src/alts.mjs): Market Watcher-style HTF spot setups on the top alts (Gate.io daily candles) and on the meme universe.
# Once a day after the UTC daily close, or by hand: Actions -> "RynoScan alts desk" -> Run workflow.
name: RynoScan alts desk
on:
  schedule:
    - cron: "20 0 * * *"   # daily, 00:20 UTC (10:20am Brisbane), just after the daily close
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: rynoscan-alts
  cancel-in-progress: false
jobs:
  alts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Scan the alts and memes for HTF setups
        env:
          CG_API_KEY: ${{ secrets.CG_API_KEY }}
          CG_PLAN: ${{ vars.CG_PLAN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node src/alts.mjs
      - name: Save the results
        run: |
          git config user.name "rynoscan-bot"
          git config user.email "rynoscan-bot@users.noreply.github.com"
          git add docs/data/alts.json docs/data/alts-state.json docs/data/alts-book.json config/alts-positions.json
          git diff --cached --quiet && echo "no changes" || (git commit -m "alts desk $(date -u +%Y-%m-%d)" && git pull --rebase -q && git push)
      - name: Phone alert if it broke
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -n "$NTFY_TOPIC" ] && curl -s -H "Title: RynoScan alts desk failed" -H "Priority: high" -d "The daily alts scan failed. Open the Actions tab to see why." "https://ntfy.sh/$NTFY_TOPIC" || true
