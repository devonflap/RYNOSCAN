# The card finder (src/cards.mjs): Pokémon and One Piece singles from tcgcsv.com (TCGplayer market prices), daily after tcgcsv's update
# (about 20:05 UTC = 6am Brisbane). The price archives live in GitHub's cache, so each run downloads one new day.
name: Card finder
on:
  schedule:
    - cron: "37 20 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: card-finder
  cancel-in-progress: false
jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Restore the price archives
        uses: actions/cache@v4
        with:
          path: data/cardarc
          key: cardarc-${{ github.run_id }}
          restore-keys: cardarc-
      - name: Find the cards
        run: node src/cards.mjs
      - name: Slabs on sale (Collector Crypt on Magic Eden)
        run: node src/slabs.mjs || true
      - name: Save
        run: |
          git config user.name "rynoscan-bot"
          git config user.email "rynoscan-bot@users.noreply.github.com"
          git add docs/cards/data/cards.json docs/cards/data/slabs.json
          git diff --cached --quiet && echo "no changes" || (git commit -m "cards $(date -u +%Y-%m-%d)" && (for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push && break; sleep $((i*5)); done; git fetch -q && [ "$(git rev-parse HEAD)" = "$(git rev-parse @{u})" ]))
