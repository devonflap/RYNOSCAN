# The bottomed-out bot's daily list (src/bottoms.mjs): SOL's risk-on / risk-off switch and the Solana meme coins that have just reached
# 70%, 80% or 90% under their high of the year. Daily, or by hand: Actions -> "RynoScan bottoms list" -> Run workflow.
name: RynoScan bottoms list
on:
  schedule:
    - cron: "20 1 * * *"   # daily, 01:20 UTC (11:20am Brisbane), after the UTC daily close
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: rynoscan-bottoms
  cancel-in-progress: false
jobs:
  bottoms:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Find the coins newly at a DCA level
        env:
          CG_API_KEY: ${{ secrets.CG_API_KEY }}
          CG_PLAN: ${{ vars.CG_PLAN }}
        run: node src/bottoms.mjs
      - name: Save the list
        run: |
          git config user.name "rynoscan-bot"
          git config user.email "rynoscan-bot@users.noreply.github.com"
          git add docs/data/bottoms.json
          git diff --cached --quiet && echo "no changes" || (git commit -m "bottoms list $(date -u +%Y-%m-%d)" && (for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep $((i*5)); done; git fetch -q && [ "$(git rev-parse HEAD)" = "$(git rev-parse @{u})" ]))
